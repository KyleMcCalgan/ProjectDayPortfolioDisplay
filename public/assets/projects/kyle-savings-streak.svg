    <circle cx="968" cy="254" r="31" fill="#fff"/><circle cx="1054" cy="254" r="31" fill="#fff"/>
  </g>
  <path d="m613 254 8 8 15-18M699 254l8 8 15-18M785 254l8 8 15-18M871 254l8 8 15-18" fill="none" stroke="#0c1b2a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="66" y="426" width="510" height="176" rx="22" fill="#f3faf6" stroke="#d9e9e2" stroke-width="3"/>
