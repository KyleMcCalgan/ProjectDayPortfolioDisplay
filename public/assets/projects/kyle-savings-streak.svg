<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Savings Streak sample project</title>
  <desc id="desc">A sample savings habit screen with a weekly streak, a savings target, and progress dots.</desc>
  <rect width="1200" height="680" fill="#fff0c9"/>
  <rect x="24" y="24" width="1152" height="632" rx="28" fill="#fff" stroke="#0c1b2a" stroke-width="6"/>
  <text x="66" y="98" fill="#0c1b2a" font-family="system-ui, sans-serif" font-size="42" font-weight="800">Savings Streak</text>
  <rect x="942" y="51" width="190" height="46" rx="23" fill="#ffe1eb" stroke="#b92f69" stroke-width="2"/>
  <text x="976" y="81" fill="#b92f69" font-family="system-ui, sans-serif" font-size="18" font-weight="800" letter-spacing="2">SAMPLE PROJECT</text>
