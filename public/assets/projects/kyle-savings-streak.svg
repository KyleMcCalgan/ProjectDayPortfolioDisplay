  <text x="642" y="538" fill="#0c1b2a" font-family="system-ui, sans-serif" font-size="32" font-weight="800">Tomorrow</text>
  <text x="642" y="574" fill="#716c7a" font-family="system-ui, sans-serif" font-size="19">Keep your sample streak going.</text>
